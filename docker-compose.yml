services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://oficina:oficina_local@db:5432/oficina
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-sharing-123456}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oficina.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TroqueEstaSenha123!}
      PUBLIC_TRACKING_SECRET: ${PUBLIC_TRACKING_SECRET:-local-tracking-secret-change-before-sharing-123456}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
